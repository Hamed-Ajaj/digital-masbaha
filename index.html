<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/digital-tasbeeh.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e7a5c" />

    <title>المسبحة الرقمية — Digital Masbaha</title>
    <meta
      name="description"
      content="Counter and adhkar reader for daily dhikr — a calm, focused digital misbaha."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="المسبحة الرقمية — Digital Masbaha" />
    <meta
      property="og:description"
      content="A calm, focused digital misbaha for daily dhikr and adhkar."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>

    <!-- Cairo (UI) · Amiri (adhkar) · Reem Kufi (display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400..800&family=Reem+Kufi:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
